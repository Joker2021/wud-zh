name: Build and publish WUD Chinese image

on:
  workflow_dispatch:
    inputs:
      version:
        description: WUD release version in upstream.lock.json
        required: true
        type: string
      commit:
        description: WUD source commit in upstream.lock.json
        required: true
        type: string

run-name: Build WUD ${{ inputs.version }} (${{ inputs.commit }})

permissions:
  contents: read

jobs:
  validate-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.2.0
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1
      - name: Load release lock
        id: source
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          python3 - <<'PY'
          import json, os, re
          d = json.load(open("upstream.lock.json", encoding="utf-8"))
          if not re.fullmatch(r"\d+\.\d+\.\d+", d["version"]) or not re.fullmatch(r"[0-9a-f]{40}", d["commit"]):
              raise SystemExit("invalid upstream lock")
          if (d["version"], d["commit"]) != (os.environ["INPUT_VERSION"], os.environ["INPUT_COMMIT"]):
              raise SystemExit("workflow inputs do not match upstream.lock.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={d['version']}\ncommit={d['commit']}\n")
          PY
      - name: Fetch exact source
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          git clone --no-checkout https://github.com/getwud/wud.git upstream
          git -C upstream fetch --depth 1 origin "$COMMIT"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
      - name: Run upstream tests, build, and translation coverage gate
        run: |
          (cd upstream/app && npm ci --include=dev --omit=optional --no-audit --no-fund --no-update-notifier && npm test -- --runInBand --forceExit && npm run build)
          (cd upstream/ui && npm ci --include=dev --omit=optional --no-audit --no-fund --no-update-notifier && npm run test:unit -- --runInBand)
          node scripts/i18n.mjs extract --upstream upstream --output /tmp/wud-strings.json
          node scripts/i18n.mjs apply --upstream upstream --translations translations/zh-CN.json --report /tmp/wud-coverage.json
          (cd upstream/ui && npm run build)
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = (p for p in Path("upstream/ui/dist").rglob("*") if p.is_file() and p.suffix in {".js", ".html"})
          if not any(re.search(r"[\u4e00-\u9fff]", p.read_text(encoding="utf-8", errors="ignore")) for p in files):
              raise SystemExit("Built UI has no Chinese text")
          PY
          cat /tmp/wud-coverage.json >> "$GITHUB_STEP_SUMMARY"
      - name: Build multi-architecture OCI archive
        env:
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --file upstream/Dockerfile --build-arg WUD_VERSION="$VERSION" --label org.opencontainers.image.source=https://github.com/getwud/wud --label org.opencontainers.image.revision="$COMMIT" --label org.opencontainers.image.version="$VERSION" --output type=oci,dest=/tmp/wud-image.oci.tar upstream
      - name: Smoke-test amd64 image without Docker Socket
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          skopeo copy --override-os linux --override-arch amd64 oci-archive:/tmp/wud-image.oci.tar docker-daemon:wud-smoke:ci
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          docker run -d --name wud-smoke -p 18765:3000 -e WUD_AUTH_ADMIN_USER=smoke -e WUD_AUTH_ADMIN_PASSWORD="$password" wud-smoke:ci
          trap 'docker logs wud-smoke 2>/dev/null || true; docker rm -f wud-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 45); do if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then break; fi; sleep 2; done
          curl --fail --silent http://127.0.0.1:18765/health >/dev/null
          unauth="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18765/api/containers)"
          test "$unauth" = 401
          auth="$(curl --silent --user "smoke:$password" --output /tmp/wud-containers.json --write-out '%{http_code}' http://127.0.0.1:18765/api/containers)"
          test "$auth" = 200
          jq -e 'type == "array"' /tmp/wud-containers.json
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          from urllib.request import urlopen
          import re

          base = "http://127.0.0.1:18765/"
          class Scripts(HTMLParser):
              sources = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      src = dict(attrs).get("src")
                      if src:
                          self.sources.append(src)

          parser = Scripts()
          parser.feed(urlopen(base).read().decode("utf-8", errors="replace"))
          if not parser.sources:
              raise SystemExit("No JavaScript assets found in UI")
          for src in parser.sources:
              text = urlopen(urljoin(base, src)).read().decode("utf-8", errors="replace")
              if re.search(r"[\u4e00-\u9fff]", text):
                  break
          else:
              raise SystemExit("No Chinese text found in referenced JavaScript assets")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wud-image-${{ github.sha }}
          path: /tmp/wud-image.oci.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate-build
    runs-on: ubuntu-latest
    # Serialize registry mutations. Older jobs re-check main before moving stable/latest.
    concurrency:
      group: wud-zh-ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wud-image-${{ github.sha }}
          path: /tmp
      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish validated image and release tags
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ vars.WUD_IMAGE }}
          VERSION: ${{ needs.validate-build.outputs.version }}
          COMMIT: ${{ needs.validate-build.outputs.commit }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$IMAGE"
          IMAGE="${IMAGE,,}"
          version_tag="${VERSION}-zh.1"
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          candidate="$IMAGE:candidate-$SHA"
          skopeo copy --all --dest-authfile "$HOME/.docker/config.json" oci-archive:/tmp/wud-image.oci.tar "docker://$candidate"
          docker buildx imagetools inspect --raw "$candidate" | jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null) and ([.manifests[].platform | select(.os == "linux") | .architecture] | index("arm64") != null)'

          image_digest() {
            local digest
            digest="$(docker buildx imagetools inspect "$1" | digest_from_inspect)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not read manifest digest for $1" >&2; return 1; }
            printf '%s' "$digest"
          }

          digest_from_inspect() {
            local digest
            digest="$(awk '$1 == "Digest:" { print $2; exit }')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }

          expected_digest="sha256:$(printf '%064d' 0)"
          test "$(printf 'Digest:    %s\n' "$expected_digest" | digest_from_inspect)" = "$expected_digest"
          if printf 'Digest:    invalid\n' | digest_from_inspect >/dev/null; then
            echo "Digest parser accepted invalid output" >&2
            exit 1
          fi

          verify_architectures() {
            docker buildx imagetools inspect --raw "$1" |
              jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null) and ([.manifests[].platform | select(.os == "linux") | .architecture] | index("arm64") != null)' >/dev/null
          }

          verify_source_labels() {
            local image_ref="$1" arch
            for arch in amd64 arm64; do
              if ! skopeo inspect --authfile "$HOME/.docker/config.json" --config --override-os linux --override-arch "$arch" "docker://$image_ref" |
                python3 -c 'import json, sys; cfg=json.load(sys.stdin); labels=(cfg.get("config") or {}).get("Labels") or {}; sys.exit(0 if labels.get("org.opencontainers.image.version") == sys.argv[1] and labels.get("org.opencontainers.image.revision") == sys.argv[2] else 1)' "$VERSION" "$COMMIT"; then
                return 1
              fi
            done
          }

          tag_digest_state() {
            if [[ "$1" == "$2" ]]; then
              printf 'same'
            else
              printf 'different'
            fi
          }
          test "$(tag_digest_state sha256:one sha256:one)" = same
          test "$(tag_digest_state sha256:one sha256:two)" = different

          candidate_digest="$(image_digest "$candidate")"
          version_ref="$IMAGE:$version_tag"
          if version_inspect="$(docker buildx imagetools inspect "$IMAGE:$version_tag" 2>&1)"; then
            version_digest="$(printf '%s\n' "$version_inspect" | digest_from_inspect)" || { echo "Could not read manifest digest for existing tag $version_tag" >&2; exit 1; }
            [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not read manifest digest for existing tag $version_tag" >&2; exit 1; }
            if [[ "$(tag_digest_state "$candidate_digest" "$version_digest")" == different ]]; then
              verify_architectures "$version_ref" || { echo "Existing immutable tag $version_tag lacks amd64/arm64 manifests" >&2; exit 1; }
              verify_source_labels "$version_ref" || { echo "Existing immutable tag $version_tag has mismatched source labels" >&2; exit 1; }
              echo "Candidate digest differs; reusing immutable image $version_ref after revision and architecture checks."
            else
              echo "Immutable image tag $version_tag already matches $candidate_digest; resuming publication."
            fi
          else
            if ! grep -Eqi '(manifest unknown|not found)' <<<"$version_inspect"; then
              echo "Could not safely determine whether immutable image tag $version_tag exists:" >&2
              echo "$version_inspect" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$IMAGE:$version_tag" "$candidate"
            version_digest="$(image_digest "$IMAGE:$version_tag")"
            if [[ "$version_digest" != "$candidate_digest" ]]; then
              echo "Published image tag $version_tag digest does not match the validated candidate" >&2
              exit 1
            fi
          fi

          release_tag="wud-${version_tag}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "GitHub Release $release_tag already exists; continuing publication."
          else
            gh release create "$release_tag" --title "WUD ${VERSION} 简体中文版" --notes "基于 WUD ${VERSION}（${COMMIT}）构建。镜像：${IMAGE}:${version_tag}。双架构构建及 amd64 启动检查已通过。"
          fi

          # Only the lock currently on main may advance the mutable aliases. A queued
          # older build can still finish its immutable release without rolling aliases back.
          current_lock="$(gh api "repos/${GITHUB_REPOSITORY}/contents/upstream.lock.json?ref=main" --jq '.content' | base64 --decode)"
          if ! python3 - "$current_lock" "$VERSION" "$COMMIT" <<'PY'
          import json, sys
          current = json.loads(sys.argv[1])
          raise SystemExit(0 if current.get("version") == sys.argv[2] and current.get("commit") == sys.argv[3] else 1)
          PY
          then
            echo "main has advanced beyond WUD ${VERSION} (${COMMIT}); leaving stable/latest unchanged."
            exit 0
          fi

          docker buildx imagetools create --tag "$IMAGE:stable" --tag "$IMAGE:latest" "$version_ref"
