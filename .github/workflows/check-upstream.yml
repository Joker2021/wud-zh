name: Check upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(["python3", "scripts/check_upstream.py"], text=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"update={str(data['update']).lower()}\nversion={data['latest']}\ncommit={data['commit']}\n")
          print(f"Stable upstream: {data['latest']} at {data['commit']}; update={data['update']}")
          PY
      - if: steps.check.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run translate.yml -f version='${{ steps.check.outputs.version }}' -f commit='${{ steps.check.outputs.commit }}'
